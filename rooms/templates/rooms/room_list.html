{% extends "base.html" %}

{% block title %}
    Помещения – MeetSync
{% endblock %}

{% block content %}
    <h1>Онлайн-комнаты (помещения)</h1>
    <p>
        Всего помещений: {{ rooms|length }}
    </p>
    {% for room in rooms %}
        {% include "rooms/includes/room_card.html" %}
    {% empty %}
        <p>Помещения не найдены.</p>
    {% endfor %}
{% endblock %}
