{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MeetSync{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body>
    <header class="container pt-3">
        <img
            src="{% static 'homepage/img/logo.png' %}"
            alt="MeetSync"
            class="meetsync-logo"
        >
        {% include "includes/navigation.html" %}
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-4 mb-3 border-top pt-3 text-muted">
        <p>
            © <span id="current-year"></span> MeetSync — сервис онлайн-встреч
        </p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
